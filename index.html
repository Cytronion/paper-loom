<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paper Loom · BCA examination sheet</title>
  <style>
    :root {
      --paper: #f7f1e4;
      --ink: #1e2430;
      --navy: #1e2a4a;
      --rule: #c9b89a;
      --red: #a32020;
      --muted: #6e6456;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #e5dccb;
      color: var(--ink);
      font-family: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    }
    .page {
      max-width: 820px;
      margin: 24px auto 40px;
      background: var(--paper);
      padding: 36px 42px 48px;
      box-shadow: 0 16px 40px rgba(40, 30, 16, 0.15);
      position: relative;
      overflow: hidden;
    }
    .stamp {
      position: absolute; top: 28px; right: 36px;
      border: 3px solid var(--red); color: var(--red);
      font-family: "Courier New", monospace; letter-spacing: 0.14em;
      padding: 6px 8px; transform: rotate(8deg); font-size: 13px;
    }
    .center { text-align: center; }
    .univ { letter-spacing: 0.2em; font-size: 12px; color: var(--navy); }
    h1 { font-weight: 500; font-size: 28px; margin: 8px 0 0; }
    .meta { display: flex; justify-content: space-between; border-top: 2px solid var(--navy); border-bottom: 1px solid var(--navy); margin: 18px 0; padding: 6px 0; font-size: 14px; }
    ol { padding-left: 22px; }
    li { margin: 14px 0; line-height: 1.45; }
    .tag { font-family: "Courier New", monospace; font-size: 11px; color: var(--muted); letter-spacing: 0.04em; }
    .threads { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .thread { border: 1px solid var(--navy); padding: 4px 8px; font-family: "Courier New", monospace; font-size: 12px; }
    button {
      font-family: "Courier New", monospace; background: var(--navy); color: #f7f1e4;
      border: none; padding: 8px 12px; cursor: pointer; letter-spacing: 0.08em;
    }
    .tools { display: flex; gap: 12px; align-items: center; margin: 8px 0 18px; }
    label { font-family: "Courier New", monospace; font-size: 12px; color: var(--muted); }
    input { width: 54px; font: inherit; border: none; border-bottom: 1px solid var(--navy); background: transparent; }
    .foot { margin-top: 22px; font-size: 13px; color: var(--muted); }
    @media (max-width: 700px) {
      .page { margin: 0; padding: 28px 18px 36px; }
      .stamp { position: static; display: inline-block; margin-bottom: 8px; }
    }
  </style>
</head>
<body>
  <article class="page">
    <div class="stamp">WOVEN<br>NOT SHUFFLED</div>
    <div class="center">
      <div class="univ">DEPARTMENT OF COMPUTER APPLICATIONS</div>
      <h1>Paper Loom</h1>
      <div>BCA Semester IV · Internal practice paper</div>
    </div>
    <div class="meta"><span>Time: 90 minutes</span><span>Max marks: 30</span><span id="seed-label">Weave 7</span></div>
    <div class="tools">
      <label>Questions <input id="length" type="number" min="4" max="8" value="6" /></label>
      <button id="weave" type="button">Weave again</button>
    </div>
    <ol id="paper"></ol>
    <div class="foot">Thread map · each unit must appear before a unit may repeat. Neighbouring questions never share a unit.</div>
    <div class="threads" id="threads"></div>
  </article>
  <script>
    const BANK = [
      { id: "DS1", unit: "DS", level: 1, q: "State the difference between a stack and a queue with one use of each." },
      { id: "DS2", unit: "DS", level: 2, q: "Insert the keys 14, 9, 22, 3 into an empty BST and write the inorder walk." },
      { id: "DS3", unit: "DS", level: 3, q: "Compare adjacency list and matrix for a sparse graph of 10,000 nodes." },
      { id: "DB1", unit: "DBMS", level: 1, q: "Define a candidate key and a foreign key in one line each." },
      { id: "DB2", unit: "DBMS", level: 2, q: "Normalize an order table (order_id, customer, product, city) to 3NF." },
      { id: "DB3", unit: "DBMS", level: 3, q: "Why can a schedule be serializable and still deadlock? Give a two-transaction case." },
      { id: "OS1", unit: "OS", level: 1, q: "Name the process states in a simple five-state model." },
      { id: "OS2", unit: "OS", level: 2, q: "Compute average waiting time for SJF on bursts 6, 2, 8, 3." },
      { id: "OS3", unit: "OS", level: 3, q: "Explain thrashing and one change that reduces it without buying RAM." },
      { id: "CN1", unit: "CN", level: 1, q: "Which OSI layer decides the route, and which one checks the frame?" },
      { id: "CN2", unit: "CN", level: 2, q: "A /26 network starts at 192.168.4.0. List the first and last usable hosts." },
      { id: "CN3", unit: "CN", level: 3, q: "Why does TCP use both a sequence number and a window, not just one?" }
    ];
    const ARC = [1, 1, 2, 3, 2, 2, 2, 1];
    let seed = 7;
    function rng(n) { n = (n * 16807) % 2147483647; return n; }
    function weave(length) {
      let state = seed;
      const pool = BANK.map(q => ({ ...q }));
      for (let i = pool.length - 1; i > 0; i--) {
        state = rng(state);
        const j = state % (i + 1);
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      const units = [...new Set(BANK.map(q => q.unit))];
      const used = Object.fromEntries(units.map(u => [u, 0]));
      const paper = [];
      for (let slot = 0; slot < length; slot++) {
        const want = ARC[slot] || 2;
        const previous = paper.length ? paper[paper.length - 1].unit : null;
        const short = units.filter(u => used[u] === 0);
        const legal = pool.filter(q => {
          if (previous && q.unit === previous) return false;
          if (short.length && !short.includes(q.unit) && paper.length < units.length) return false;
          return true;
        });
        const source = legal.length ? legal : pool;
        source.sort((a, b) => Math.abs(a.level - want) - Math.abs(b.level - want));
        const pick = source[0];
        paper.push(pick);
        pool.splice(pool.indexOf(pick), 1);
        used[pick.unit] += 1;
      }
      return { paper, used };
    }
    function render() {
      const length = Number(document.getElementById("length").value || 6);
      const { paper, used } = weave(length);
      document.getElementById("seed-label").textContent = "Weave " + seed;
      document.getElementById("paper").innerHTML = paper.map(item =>
        `<li>${item.q} <div class="tag">${item.unit} · level ${item.level} · ${item.id}</div></li>`).join("");
      document.getElementById("threads").innerHTML = Object.entries(used).map(([unit, count]) =>
        `<span class="thread">${unit} × ${count}</span>`).join("");
    }
    document.getElementById("weave").addEventListener("click", () => { seed += 3; render(); });
    document.getElementById("length").addEventListener("change", render);
    render();
  </script>
</body>
</html>
